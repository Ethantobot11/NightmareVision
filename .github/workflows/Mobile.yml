name: Mobile Binaries

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      buildFlags:
        required: false
        type: string

jobs:
  Android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin' # Most stable for Android builds
          java-version: '17'      # Use 11 or 17 depending on your NDK version

      - name: Set JAVA_HOME
        run: echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV

      - name: Install Libs
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          haxelib install hxpkg --quiet
          haxelib install compiletime --quiet
          haxelib run hxpkg install

      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true

      - name: Compile Android
        run: haxelib run lime build android -D ${{ inputs.buildFlags || '' }}

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightmareVision-Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk

  iOS:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install Libs
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          haxelib install hxpkg --quiet
          haxelib install compiletime --quiet
          haxelib run hxpkg install --quiet

      - name: Compile iOS
        run: haxelib run lime build ios -nosign -D ${{ inputs.buildFlags || '' }}

      - name: Make IPA
        run: |
          brew install ldid
          cd export/release/ios/build/Release-iphoneos/VSImpostor.app
          ldid -S../../../VSImpostor/VSImpostor.entitlements VSImpostor
          cd ..
          mkdir Payload
          mv VSImpostor.app Payload
          zip -r VSImpostor.ipa Payload

      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightmareVision-iOS
          path: export/release/ios/build/Release-iphoneos/*.ipa
