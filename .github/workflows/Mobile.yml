name: Desktop and Mobile Binaries

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      buildFlags:
        required: false
        type: string
env:
  PROJECT_NAME: NightmareVision

jobs:
  # --- DESKTOP JOBS ---

  Windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7
      - name: Install Libs
        run: |
          haxelib setup C:/haxelib
          haxelib install hxcpp > nul
          haxelib install hxpkg --quiet
          haxelib install compiletime --quiet
          haxelib run hxpkg install
      - name: Compile Windows
        run: haxelib run lime build windows -release -D ${{ inputs.buildFlags || '' }}
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightmareVision-Windows
          path: export/release/windows/bin/*.exe

  Linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libgl1-mesa-dev libglu1-mesa-dev libalut-dev libasound2-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7
      - name: Install Libs
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null
          haxelib install hxpkg --quiet
          haxelib install compiletime --quiet
          haxelib run hxpkg install
      - name: Compile Linux
        run: haxelib run lime build linux -release -D ${{ inputs.buildFlags || '' }}
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightmareVision-Linux
          path: export/release/linux/bin/*

  macOS:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7
      - name: Install Libs
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null
          haxelib install hxpkg --quiet
          haxelib install compiletime --quiet
          haxelib run hxpkg install
      - name: Compile macOS
        run: haxelib run lime build mac -release -D ${{ inputs.buildFlags || '' }}
      - name: Zip App
        run: |
          cd export/release/mac/bin
          zip -r ../../../NightmareVision-macOS.zip .
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightmareVision-macOS
          path: NightmareVision-macOS.zip

  # --- YOUR EXISTING MOBILE JOBS ---

  Android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Libs
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          haxelib install hxpkg --quiet
          haxelib install compiletime --quiet
          haxelib run hxpkg install
      - name: Configure Android
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_LATEST_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
      - name: Compile Android
        run: haxelib run lime build android -D ${{ inputs.buildFlags || '' }}
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightmareVision-Android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk

  iOS:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7
      - name: Install Libs
        run: |
          haxelib setup ~/haxelib
          haxelib install hxcpp > /dev/null --quiet
          haxelib install hxpkg --quiet
          haxelib install compiletime --quiet
          haxelib run hxpkg install
      - name: Compile iOS
        run: haxelib run lime build ios -nosign -D ${{ inputs.buildFlags || '' }}
      - name: Make IPA
        run: |
          brew install ldid
          cd export/release/ios/build/Release-iphoneos/*.app
          ldid -S NightmareVision
          cd ..
          mkdir Payload
          cp -r *.app Payload/
          zip -r NightmareVision.ipa Payload
      - name: Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NightmareVision-iOS
          path: export/release/ios/build/Release-iphoneos/*.ipa
  Switch:
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder for Nintendo Switch
        run: |
          echo "Nintendo Switch build is currently a placeholder."
          echo "Waiting for SDK approval from Nintendo Developer Portal."
      - name: Success Signal
        run: exit 0

  Releaser:
    needs: [Windows, Linux, macOS, Android, iOS, Switch]
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish The Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release 0.1"
          tag_name: "0.1"
          make_latest: true
          files: |
            artifacts/NightmareVision-Windows/*.exe
            artifacts/NightmareVision-Linux/*
            artifacts/NightmareVision-macOS/*.zip
            artifacts/NightmareVision-Android/*.apk
            artifacts/NightmareVision-iOS/*.ipa
